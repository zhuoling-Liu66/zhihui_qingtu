spring.application.name=zhihuiqingtu
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campus_activity_platform?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:adc123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}

spring.data.redis.timeout=${REDIS_TIMEOUT:3s}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:3s}


mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.banner=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

campus.upload.base-dir=${UPLOAD_BASE_DIR:${user.dir}/uploads}
campus.upload.max-cover-size=5MB


jwt.secret=${JWT_SECRET}
jwt.expiration=43200000


jwt.algorithm=HS512


campus.security.legacy-token-header=token


springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ══════════════════ AI 助手 ══════════════════
# 供应商：deepseek / openai / ollama（需同时引入对应 starter）。
# 只影响自动配置启用哪个 ChatModel，业务代码不变。
spring.ai.model.chat=${AI_PROVIDER:deepseek}
# 注意这里给了默认占位符而不是空值：Spring AI 创建 ChatModel 时会对 api-key 做非空断言，
# 留空会导致【整个应用启动失败】——不配 Key 的同学连活动列表都打不开。
# 真正的"未配置"判断在 AiChatService 里做：key 等于占位符 → 返回 503。
spring.ai.deepseek.api-key=${AI_API_KEY:local-placeholder}
spring.ai.deepseek.base-url=${AI_BASE_URL:https://api.deepseek.com}
spring.ai.deepseek.chat.model=${AI_MODEL:deepseek-v4-flash}
spring.ai.deepseek.chat.temperature=0.3
spring.ai.deepseek.chat.max-tokens=800

# 重试：只对超时/5xx 重试，4xx 直接失败（省时间也省钱）
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=4s
spring.ai.retry.on-client-errors=false

campus.ai.enabled=${AI_ENABLED:true}
campus.ai.chat.timeout=90s
campus.ai.chat.first-token-timeout=30s
campus.ai.chat.history-window=10
campus.ai.chat.max-tool-rounds=4
campus.ai.chat.max-candidates=20
campus.ai.chat.recommend-limit=6
campus.ai.tool.timeout=3s
campus.ai.tool.max-result-chars=4000
campus.ai.quota.daily-tokens=${AI_DAILY_TOKENS:100000}
campus.ai.ratelimit.per-minute=${AI_RATE_PER_MINUTE:10}
campus.ai.action.ttl=5m
